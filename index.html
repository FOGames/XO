<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rush Runner 3D</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:#07111c;
 font-family:Arial,sans-serif;
 touch-action:none;
 user-select:none;
}
#game{position:fixed;inset:0}
#ui{
 position:fixed;
 inset:0;
 pointer-events:none;
 color:#fff;
}
.panel{
 background:rgba(0,0,0,.55);
 border:1px solid rgba(255,255,255,.16);
 backdrop-filter:blur(7px);
 border-radius:16px;
 padding:10px 15px;
}
#score{
 position:absolute;
 top:14px;
 left:14px;
 font-size:18px;
}
#coins{
 position:absolute;
 top:14px;
 right:14px;
 font-size:18px;
}
#speed{
 position:absolute;
 top:70px;
 left:50%;
 transform:translateX(-50%);
 font-size:14px;
}
#start,#gameover{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.7);
 pointer-events:auto;
}
.box{
 width:min(90%,420px);
 padding:30px;
 text-align:center;
 background:#111b28;
 border:1px solid #3b4d63;
 border-radius:24px;
 box-shadow:0 20px 70px #000;
}
h1{
 font-size:40px;
 margin-bottom:12px;
}
p{
 margin:8px 0;
 color:#dbe5f1;
}
button{
 margin-top:18px;
 border:0;
 background:#287cff;
 color:white;
 padding:14px 30px;
 border-radius:15px;
 font-size:18px;
 font-weight:bold;
}
#gameover{display:none}
#touch{
 position:absolute;
 inset:0;
 pointer-events:none;
}
#jump,#slide{
 position:absolute;
 bottom:28px;
 width:82px;
 height:82px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:15px;
 font-weight:bold;
 pointer-events:auto;
}
#jump{
 right:25px;
 background:rgba(38,126,255,.65);
}
#slide{
 left:25px;
 background:rgba(255,110,50,.65);
}
@media(min-width:800px){
 #touch{display:none}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="ui">

<div id="score" class="panel">
🏆 النقاط: <b id="scoreText">0</b>
</div>

<div id="coins" class="panel">
🪙 <b id="coinText">0</b>
</div>

<div id="speed" class="panel">
⚡ السرعة: <b id="speedText">1</b>
</div>

<div id="touch">
 <div id="jump">⬆️ قفز</div>
 <div id="slide">⬇️ انزلاق</div>
</div>

<div id="start">
 <div class="box">
  <h1>🏃 Rush Runner</h1>
  <p>اجري لأطول مسافة ممكنة!</p>
  <p>اسحب يمين ويسار لتغيير المسار</p>
  <p>اسحب لأعلى للقفز ولأسفل للانزلاق</p>
  <button id="startBtn">ابدأ اللعب</button>
 </div>
</div>

<div id="gameover">
 <div class="box">
  <h1>💥 انتهت اللعبة</h1>
  <p>النقاط: <b id="finalScore">0</b></p>
  <p>العملات: 🪙 <b id="finalCoins">0</b></p>
  <p>أفضل نتيجة: 🏆 <b id="bestScore">0</b></p>
  <button onclick="location.reload()">العب مرة أخرى</button>
 </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

/* =========================
   Three.js
========================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8cc8ef);

scene.fog=new THREE.Fog(
 0x8cc8ef,
 25,
 95
);

const camera=new THREE.PerspectiveCamera(
 65,
 innerWidth/innerHeight,
 .1,
 180
);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.4)
);

renderer.setSize(
 innerWidth,
 innerHeight
);

document
 .getElementById("game")
 .appendChild(renderer.domElement);


/* =========================
   الإضاءة
========================= */

scene.add(
 new THREE.HemisphereLight(
  0xffffff,
  0x49604d,
  2.2
 )
);

const sun=new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  -10,30,20
);

scene.add(sun);


/* =========================
   الطريق
========================= */

const roadSegments=[];

const roadMaterial=
 new THREE.MeshStandardMaterial({
  color:0x30353b,
  roughness:1
 });

const lineMaterial=
 new THREE.MeshBasicMaterial({
  color:0xf4e39a
 });

const segmentLength=20;

for(let i=0;i<8;i++){

 const segment=new THREE.Group();

 const road=new THREE.Mesh(
  new THREE.BoxGeometry(
   12,.2,segmentLength
  ),
  roadMaterial
 );

 road.position.y=-.1;

 segment.add(road);

 for(const x of [-2,2]){

  const line=new THREE.Mesh(
   new THREE.BoxGeometry(
    .08,.03,segmentLength
   ),
   lineMaterial
  );

  line.position.set(
   x,.03,0
  );

  segment.add(line);
 }

 segment.position.z=
  -i*segmentLength;

 scene.add(segment);

 roadSegments.push(segment);
}


/* =========================
   الجوانب
========================= */

const sideObjects=[];

function createTree(){

 const group=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(
   .18,.25,1.5,6
  ),
  new THREE.MeshStandardMaterial({
   color:0x70482c
  })
 );

 trunk.position.y=.75;

 group.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.ConeGeometry(
   1.2,2.8,7
  ),
  new THREE.MeshStandardMaterial({
   color:0x218044
  })
 );

 crown.position.y=2.4;

 group.add(crown);

 return group;
}

for(let i=0;i<35;i++){

 const tree=createTree();

 tree.position.set(
  Math.random()<.5 ? -8-Math.random()*5 : 8+Math.random()*5,
  0,
  -Math.random()*150
 );

 scene.add(tree);

 sideObjects.push(tree);
}


/* =========================
   اللاعب
========================= */

const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(
  .42,.9,4,8
 ),
 new THREE.MeshStandardMaterial({
  color:0x287cff
 )
);

body.position.y=1;

player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(
  .4,12,8
 ),
 new THREE.MeshStandardMaterial({
  color:0xffc29e
 })
);

head.position.y=1.9;

player.add(head);

player.position.set(
 0,0,4
);

scene.add(player);


/* =========================
   اللعبة
========================= */

let running=false;
let gameOver=false;

let lane=0;
let targetX=0;

const laneWidth=3;

let velocityY=0;
let grounded=true;
let sliding=false;
let slideTimer=0;

let speed=.42;
let score=0;
let coins=0;

let spawnTimer=0;
let coinTimer=0;

const obstacles=[];
const coinObjects=[];


/* =========================
   العقبات
========================= */

function createObstacle(){

 const laneIndex=
  Math.floor(Math.random()*3)-1;

 const type=
  Math.random()<.25
   ?"high"
   :"block";

 const obstacle=new THREE.Mesh(
  type==="high"
   ?new THREE.BoxGeometry(2.4,1.1,1.5)
   :new THREE.BoxGeometry(2.3,2.2,1.5),

  new THREE.MeshStandardMaterial({
   color:type==="high"
    ?0xffa52f
    :0xe54545
  })
 );

 obstacle.position.set(
  laneIndex*laneWidth,
  type==="high"?.55:1.1,
  -90
 );

 obstacle.userData={
  lane:laneIndex,
  type,
  passed:false
 };

 scene.add(obstacle);
 obstacles.push(obstacle);
}


/* =========================
   العملات
========================= */

function createCoin(){

 const laneIndex=
  Math.floor(Math.random()*3)-1;

 const coin=new THREE.Mesh(
  new THREE.TorusGeometry(
   .35,.12,8,16
  ),
  new THREE.MeshStandardMaterial({
   color:0xffd43b,
   emissive:0x4a3500
  })
 );

 coin.position.set(
  laneIndex*laneWidth,
  1.2+Math.random()*1.2,
  -90
 );

 coin.userData={
  lane:laneIndex
 };

 scene.add(coin);

 coinObjects.push(coin);
}


/* =========================
   القفز
========================= */

function jump(){

 if(!running || !grounded || sliding)
  return;

 velocityY=.34;
 grounded=false;
}


/* =========================
   انزلاق
========================= */

function slide(){

 if(!running || !grounded)
  return;

 sliding=true;
 slideTimer=.55;
}


/* =========================
   تغيير المسار
========================= */

function moveLane(direction){

 if(!running)return;

 lane+=direction;

 lane=Math.max(
  -1,
  Math.min(1,lane)
 );

 targetX=
  lane*laneWidth;
}


/* =========================
   التصادم
========================= */

function collisionWithObstacle(o){

 const dx=
  Math.abs(
   player.position.x-
   o.position.x
  );

 const dz=
  Math.abs(
   player.position.z-
   o.position.z
  );

 if(dx<1.05 && dz<1.15){

  if(o.userData.type==="high"){

   /* القفز فوق الحاجز */

   if(player.position.y>.8)
    return false;

   /* الانزلاق تحته */

   if(sliding)
    return false;
  }

  return true;
 }

 return false;
}


/* =========================
   تحديث العقبات
========================= */

function updateObstacles(dt){

 for(let i=obstacles.length-1;i>=0;i--){

  const o=obstacles[i];

  o.position.z+=speed;

  o.rotation.y+=.01;

  if(
   !o.userData.passed &&
   o.position.z>player.position.z
  ){

   o.userData.passed=true;

   score+=10;
  }

  if(
   collisionWithObstacle(o)
  ){

   endGame();
   return;
  }

  if(o.position.z>15){

   scene.remove(o);
   obstacles.splice(i,1);
  }
 }
}


/* =========================
   تحديث العملات
========================= */

function updateCoins(){

 for(let i=coinObjects.length-1;i>=0;i--){

  const c=coinObjects[i];

  c.position.z+=speed;

  c.rotation.y+=.08;

  const dx=
   Math.abs(
    player.position.x-
    c.position.x
   );

  const dz=
   Math.abs(
    player.position.z-
    c.position.z
   );

  const dy=
   Math.abs(
    player.position.y+1-
    c.position.y
   );

  if(
   dx<1 &&
   dz<1.2 &&
   dy<1
  ){

   coins++;

   score+=25;

   scene.remove(c);

   coinObjects.splice(i,1);

   continue;
  }

  if(c.position.z>15){

   scene.remove(c);
   coinObjects.splice(i,1);
  }
 }
}


/* =========================
   العالم يتحرك
========================= */

function updateWorld(){

 for(const segment of roadSegments){

  segment.position.z+=speed;

  if(segment.position.z>15){

   segment.position.z-=8*segmentLength;
  }
 }

 for(const tree of sideObjects){

  tree.position.z+=speed;

  if(tree.position.z>20){

   tree.position.z=
    -150-Math.random()*30;

   tree.position.x=
    Math.random()<.5
     ?-8-Math.random()*5
     :8+Math.random()*5;
  }
 }
}


/* =========================
   اللاعب
========================= */

function updatePlayer(dt){

 player.position.x+=
  (targetX-player.position.x)*.18;

 if(!grounded){

  velocityY-=.018;

  player.position.y+=velocityY;

  if(player.position.y<=0){

   player.position.y=0;
   velocityY=0;
   grounded=true;
  }
 }

 if(sliding){

  slideTimer-=dt;

  if(slideTimer<=0)
   sliding=false;
 }

 /* الحركة الانحنائية */

 const desiredScaleY=
  sliding?.55:1;

 body.scale.y+=
  (desiredScaleY-body.scale.y)*.25;

 head.position.y=
  sliding?1.25:1.9;

 score+=speed*.08;
}


/* =========================
   زيادة السرعة
========================= */

function updateDifficulty(){

 speed+=.000035;

 if(speed>1.15)
  speed=1.15;
}


/* =========================
   Game Over
========================= */

function endGame(){

 if(gameOver)return;

 gameOver=true;
 running=false;

 const old=
  Number(
   localStorage.getItem(
    "rushBest"
   )||0
  );

 const best=
  Math.max(
   old,
   Math.floor(score)
  );

 localStorage.setItem(
  "rushBest",
  best
 );

 document.getElementById(
  "finalScore"
 ).textContent=
  Math.floor(score);

 document.getElementById(
  "finalCoins"
 ).textContent=
  coins;

 document.getElementById(
  "bestScore"
 ).textContent=
  best;

 document.getElementById(
  "gameover"
 ).style.display=
  "flex";
}


/* =========================
   UI
========================= */

function updateUI(){

 document.getElementById(
  "scoreText"
 ).textContent=
  Math.floor(score);

 document.getElementById(
  "coinText"
 ).textContent=
  coins;

 document.getElementById(
  "speedText"
 ).textContent=
  speed.toFixed(1);
}


/* =========================
   بداية اللعبة
========================= */

document.getElementById(
 "startBtn"
).onclick=()=>{

 document.getElementById(
  "start"
 ).style.display="none";

 running=true;

 for(let i=0;i<5;i++)
  createObstacle();

 for(let i=0;i<8;i++)
  createCoin();
};


/* =========================
   Touch
========================= */

let touchStartX=0;
let touchStartY=0;

addEventListener(
 "touchstart",
 e=>{

  if(!running)return;

  const t=e.touches[0];

  touchStartX=t.clientX;
  touchStartY=t.clientY;
 },
 {passive:false}
);

addEventListener(
 "touchend",
 e=>{

  if(!running)return;

  const t=e.changedTouches[0];

  const dx=
   t.clientX-touchStartX;

  const dy=
   t.clientY-touchStartY;

  if(
   Math.abs(dx)<35 &&
   Math.abs(dy)<35
  ){
   jump();
   return;
  }

  if(Math.abs(dx)>Math.abs(dy)){

   if(dx>40)
    moveLane(1);

   if(dx<-40)
    moveLane(-1);

  }else{

   if(dy<-40)
    jump();

   if(dy>40)
    slide();
  }
 },
 {passive:false}
);


/* أزرار الهاتف */

document.getElementById(
 "jump"
).addEventListener(
 "pointerdown",
 jump
);

document.getElementById(
 "slide"
).addEventListener(
 "pointerdown",
 slide
);


/* =========================
   Keyboard
========================= */

addEventListener(
 "keydown",
 e=>{

  if(e.key==="ArrowLeft"||e.key==="a")
   moveLane(-1);

  if(e.key==="ArrowRight"||e.key==="d")
   moveLane(1);

  if(e.key==="ArrowUp"||e.key==="w"||e.key===" ")
   jump();

  if(e.key==="ArrowDown"||e.key==="s")
   slide();
 }
);


/* =========================
   Game Loop
========================= */

let last=performance.now();

function animate(now){

 requestAnimationFrame(animate);

 const dt=
  Math.min(
   (now-last)/1000,
   .05
  );

 last=now;

 if(running){

  spawnTimer-=dt;
  coinTimer-=dt;

  if(spawnTimer<=0){

   createObstacle();

   spawnTimer=
    Math.max(
     .65,
     1.5-speed
    );
  }

  if(coinTimer<=0){

   createCoin();

   coinTimer=.45;
  }

  updateWorld();
  updatePlayer(dt);
  updateObstacles(dt);
  updateCoins();
  updateDifficulty();
  updateUI();
 }

 camera.position.lerp(
  new THREE.Vector3(
   player.position.x,
   5.5,
   player.position.z+9
  ),
  .12
 );

 camera.lookAt(
  player.position.x,
  1,
  player.position.z-7
 );

 renderer.render(
  scene,
  camera
 );
}

requestAnimationFrame(animate);


/* =========================
   Resize
========================= */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>
</body>
</html>
