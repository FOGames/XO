<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Survive & Upgrade 3D</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#071018;font-family:Arial;color:#fff;touch-action:none}
#game{position:fixed;inset:0}

#ui{position:fixed;inset:0;pointer-events:none}

.panel{
 background:rgba(0,0,0,.58);
 border:1px solid rgba(255,255,255,.14);
 backdrop-filter:blur(8px);
 border-radius:16px;
 padding:10px 14px;
}

#stats{
 position:absolute;
 top:12px;
 right:12px;
 min-width:205px;
}

#waveBox{
 position:absolute;
 top:12px;
 left:12px;
 min-width:150px;
 text-align:center;
}

.bar{
 height:10px;
 margin-top:6px;
 background:#252a31;
 border-radius:20px;
 overflow:hidden;
}

#hpBar{background:#31df77;width:100%;height:100%}
#xpBar{background:#4d9cff;width:0%;height:100%}

#crosshair{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:12px;
 height:12px;
 border:2px solid white;
 border-radius:50%;
 opacity:.7;
}

#upgrade{
 display:none;
 position:absolute;
 inset:0;
 background:rgba(0,0,0,.72);
 align-items:center;
 justify-content:center;
 pointer-events:auto;
}

#upgradeBox{
 width:min(92%,600px);
 background:#111722;
 border:1px solid #39475c;
 border-radius:22px;
 padding:22px;
 text-align:center;
 box-shadow:0 20px 70px #000;
}

#upgradeBox h2{
 margin-bottom:18px;
 font-size:28px;
}

#choices{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
}

.choice{
 background:#1b2635;
 border:1px solid #3b506d;
 border-radius:16px;
 padding:18px 10px;
 color:#fff;
 min-height:130px;
 font-size:16px;
}

.choice b{
 display:block;
 font-size:21px;
 margin-bottom:10px;
}

.choice:active{
 transform:scale(.96);
}

#gameOver{
 display:none;
 position:absolute;
 inset:0;
 background:rgba(0,0,0,.8);
 align-items:center;
 justify-content:center;
 text-align:center;
 pointer-events:auto;
}

#gameOverBox{
 background:#111722;
 border-radius:22px;
 padding:30px;
 width:min(90%,420px);
}

button{
 border:0;
 border-radius:14px;
 background:#287cff;
 color:#fff;
 padding:13px 25px;
 font-size:18px;
 font-weight:bold;
}

#controls{
 position:absolute;
 inset:0;
}

#joystick{
 position:absolute;
 left:22px;
 bottom:25px;
 width:125px;
 height:125px;
 border-radius:50%;
 background:rgba(255,255,255,.1);
 border:2px solid rgba(255,255,255,.2);
 pointer-events:auto;
}

#stick{
 position:absolute;
 left:33px;
 top:33px;
 width:55px;
 height:55px;
 border-radius:50%;
 background:rgba(255,255,255,.35);
}

#shoot{
 position:absolute;
 right:25px;
 bottom:30px;
 width:92px;
 height:92px;
 border-radius:50%;
 background:rgba(235,55,55,.8);
 border:3px solid rgba(255,255,255,.3);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
 pointer-events:auto;
}

.enemyLabel{
 position:absolute;
 color:white;
 font-size:11px;
}

@media(min-width:800px){
 #controls{display:none}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="ui">

<div id="stats" class="panel">
 ❤️ <span id="hpText">100</span>/100

 <div class="bar">
  <div id="hpBar"></div>
 </div>

 ⭐ المستوى <span id="levelText">1</span>

 <div class="bar">
  <div id="xpBar"></div>
 </div>
</div>

<div id="waveBox" class="panel">
 🌊 الموجة <b id="waveText">1</b>
 <br>
 👹 الأعداء <b id="enemyText">0</b>
</div>

<div id="crosshair"></div>

<div id="upgrade">
 <div id="upgradeBox">
  <h2>⬆️ مستوى جديد!</h2>
  <p style="margin-bottom:18px">اختر تطويرًا واحدًا</p>

  <div id="choices"></div>
 </div>
</div>

<div id="gameOver">
 <div id="gameOverBox">
  <h1>💀 انتهت اللعبة</h1>
  <br>
  <p>المستوى: <b id="finalLevel">1</b></p>
  <p>الموجة: <b id="finalWave">1</b></p>
  <br>
  <button onclick="location.reload()">العب مرة أخرى</button>
 </div>
</div>

<div id="controls">

 <div id="joystick">
  <div id="stick"></div>
 </div>

 <div id="shoot">🔫 إطلاق</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

/* =========================
   إعداد Three.js
========================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x08121b);

scene.fog=new THREE.Fog(
 0x08121b,
 25,
 75
);

const camera=new THREE.PerspectiveCamera(
 65,
 innerWidth/innerHeight,
 .1,
 150
);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.35)
);

renderer.setSize(innerWidth,innerHeight);

document
 .getElementById("game")
 .appendChild(renderer.domElement);


/* =========================
   إضاءة
========================= */

scene.add(
 new THREE.HemisphereLight(
  0xaacbff,
  0x172016,
  2.2
 )
);

const light=new THREE.DirectionalLight(
  0xffffff,
  1.8
);

light.position.set(20,30,10);

scene.add(light);


/* =========================
   الأرض
========================= */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({
  color:0x263d2b,
  roughness:1
 })
);

ground.rotation.x=-Math.PI/2;

scene.add(ground);


/* =========================
   ديكور الخريطة
========================= */

function tree(x,z){

 const group=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.25,1.5,6),
  new THREE.MeshStandardMaterial({
   color:0x69452d
  })
 );

 trunk.position.y=.75;

 group.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.ConeGeometry(1.15,2.5,7),
  new THREE.MeshStandardMaterial({
   color:0x1e6b3b
  })
 );

 crown.position.y=2.25;

 group.add(crown);

 group.position.set(x,0,z);

 scene.add(group);
}

function rock(x,z){

 const r=new THREE.Mesh(
  new THREE.DodecahedronGeometry(
   .6+Math.random()*.5,
   0
  ),
  new THREE.MeshStandardMaterial({
   color:0x5c6265
  })
 );

 r.position.set(x,.4,z);

 scene.add(r);
}

for(let i=0;i<35;i++){

 let x=(Math.random()-.5)*85;
 let z=(Math.random()-.5)*85;

 if(Math.abs(x)<8 && Math.abs(z)<8){
  i--;
  continue;
 }

 if(Math.random()<.7)
  tree(x,z);
 else
  rock(x,z);
}


/* =========================
   اللاعب
========================= */

const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.42,.8,4,8),
 new THREE.MeshStandardMaterial({
  color:0x247cff
 })
);

body.position.y=1;

player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.38,12,8),
 new THREE.MeshStandardMaterial({
  color:0xffc39f
 })
);

head.position.y=1.9;

player.add(head);

const gun=new THREE.Mesh(
 new THREE.BoxGeometry(.18,.18,1.15),
 new THREE.MeshStandardMaterial({
  color:0x171a1d
 })
);

gun.position.set(.5,1.25,-.6);

player.add(gun);

player.position.set(0,0,0);

scene.add(player);


/* =========================
   بيانات اللاعب
========================= */

let hp=100;
let maxHp=100;

let level=1;
let xp=0;
let xpNeeded=100;

let damage=25;
let fireRate=.28;
let moveSpeed=.13;

let wave=1;

let running=true;

let shooting=false;
let cooldown=0;

const enemies=[];
const bullets=[];


/* =========================
   إنشاء العدو
========================= */

function spawnEnemy(boss=false){

 const enemy=new THREE.Group();

 const color=boss?0x8e25d8:0xe04444;

 const b=new THREE.Mesh(
  new THREE.CapsuleGeometry(
   boss?.65:.4,
   boss?1.3:.7,
   4,
   8
  ),
  new THREE.MeshStandardMaterial({
   color
  })
 );

 b.position.y=boss?1.3:1;

 enemy.add(b);

 const angle=Math.random()*Math.PI*2;

 const distance=8+Math.random()*7;

 enemy.position.set(
  player.position.x+
   Math.cos(angle)*distance,
  0,
  player.position.z+
   Math.sin(angle)*distance
 );

 enemy.userData={
  hp:boss?400:60+wave*10,
  maxHp:boss?400:60+wave*10,
  speed:boss?.018:.035+wave*.002,
  attack:0,
  boss
 };

 scene.add(enemy);

 enemies.push(enemy);
}


/* =========================
   بدء الموجة
========================= */

function startWave(){

 const amount=
  Math.min(
   5+wave*2,
   35
  );

 for(let i=0;i<amount;i++)
  spawnEnemy(false);

 if(wave%5===0)
  spawnEnemy(true);
}


/* =========================
   أقرب عدو
========================= */

function nearestEnemy(){

 let best=null;
 let dist=Infinity;

 for(const e of enemies){

  const d=
   player.position.distanceTo(
    e.position
   );

  if(d<dist){

   dist=d;
   best=e;
  }
 }

 return best;
}


/* =========================
   إطلاق النار
========================= */

function shoot(){

 if(!running || cooldown>0)
  return;

 const target=nearestEnemy();

 if(!target)
  return;

 cooldown=fireRate;

 const bullet=new THREE.Mesh(
  new THREE.SphereGeometry(.1,6,6),
  new THREE.MeshBasicMaterial({
   color:0xffe56a
  })
 );

 bullet.position.copy(player.position);
 bullet.position.y=1.25;

 const direction=
  target.position.clone()
   .add(new THREE.Vector3(0,1,0))
   .sub(bullet.position)
   .normalize();

 bullet.userData={
  velocity:direction.multiplyScalar(.75),
  life:80,
  damage
 };

 scene.add(bullet);

 bullets.push(bullet);

 player.lookAt(
  target.position.x,
  0,
  target.position.z
 );
}


/* =========================
   تحديث الرصاص
========================= */

function updateBullets(){

 for(let i=bullets.length-1;i>=0;i--){

  const b=bullets[i];

  b.position.add(
   b.userData.velocity
  );

  b.userData.life--;

  let hit=false;

  for(let j=enemies.length-1;j>=0;j--){

   const e=enemies[j];

   if(
    b.position.distanceTo(
     e.position.clone()
      .add(new THREE.Vector3(0,1,0))
    )<.9
   ){

    e.userData.hp-=b.userData.damage;

    hit=true;

    if(e.userData.hp<=0){

     const gained=
      e.userData.boss?100:25;

     addXP(gained);

     scene.remove(e);

     enemies.splice(j,1);
    }

    break;
   }
  }

  if(
   hit ||
   b.userData.life<=0
  ){

   scene.remove(b);

   bullets.splice(i,1);
  }
 }
}


/* =========================
   الأعداء
========================= */

function updateEnemies(){

 for(const e of enemies){

  const direction=
   new THREE.Vector3()
    .subVectors(
     player.position,
     e.position
    );

  const distance=direction.length();

  direction.normalize();

  if(distance>1.7){

   e.position.add(
    direction.multiplyScalar(
     e.userData.speed
    )
   );

  }else{

   e.userData.attack--;

   if(e.userData.attack<=0){

    e.userData.attack=50;

    damage(
     e.userData.boss?12:6
    );
   }
  }

  e.lookAt(
   player.position.x,
   0,
   player.position.z
  );
 }
}


/* =========================
   ضرر اللاعب
========================= */

function damage(amount){

 hp-=amount;

 if(hp<=0){

  hp=0;
  endGame();
 }
}


/* =========================
   XP
========================= */

function addXP(amount){

 xp+=amount;

 while(xp>=xpNeeded){

  xp-=xpNeeded;

  level++;

  xpNeeded=
   Math.floor(
    xpNeeded*1.3
   );

  showUpgrades();
 }
}


/* =========================
   الترقيات
========================= */

const upgradeList=[

 {
  title:"⚡ سرعة الحركة",
  text:"+20% سرعة",
  apply:()=>{
   moveSpeed*=1.2;
  }
 },

 {
  title:"💥 الضرر",
  text:"+30% ضرر",
  apply:()=>{
   damage*=1.3;
  }
 },

 {
  title:"🔫 سرعة إطلاق النار",
  text:"إطلاق أسرع",
  apply:()=>{
   fireRate=Math.max(
    .08,
    fireRate*.78
   );
  }
 },

 {
  title:"❤️ صحة",
  text:"+25 صحة",
  apply:()=>{
   maxHp+=25;
   hp=Math.min(
    maxHp,
    hp+25
   );
  }
 }

];


function showUpgrades(){

 running=false;

 const box=
  document.getElementById(
   "choices"
  );

 box.innerHTML="";

 const options=[
  ...upgradeList
 ]
 .sort(()=>Math.random()-.5)
 .slice(0,3);

 for(const option of options){

  const button=
   document.createElement("button");

  button.className="choice";

  button.innerHTML=
   `<b>${option.title}</b>
    ${option.text}`;

  button.onclick=()=>{

   option.apply();

   document.getElementById(
    "upgrade"
   ).style.display="none";

   running=true;
  };

  box.appendChild(button);
 }

 document.getElementById(
  "upgrade"
 ).style.display="flex";
}


/* =========================
   الموجات
========================= */

function checkWave(){

 if(
  enemies.length===0
 ){

  wave++;

  startWave();
 }
}


/* =========================
   حركة اللاعب
========================= */

const keys={};

addEventListener(
 "keydown",
 e=>{
  keys[e.key.toLowerCase()]=true;
 }
);

addEventListener(
 "keyup",
 e=>{
  keys[e.key.toLowerCase()]=false;
 }
);

let joyX=0;
let joyY=0;

function updatePlayer(){

 let x=0;
 let z=0;

 if(keys.w||keys.arrowup)z-=1;
 if(keys.s||keys.arrowdown)z+=1;
 if(keys.a||keys.arrowleft)x-=1;
 if(keys.d||keys.arrowright)x+=1;

 x+=joyX;
 z+=joyY;

 const len=Math.hypot(x,z);

 if(len>1){
  x/=len;
  z/=len;
 }

 player.position.x+=x*moveSpeed;
 player.position.z+=z*moveSpeed;

 const target=nearestEnemy();

 if(target){

  player.lookAt(
   target.position.x,
   0,
   target.position.z
  );
 }
}


/* =========================
   الكاميرا
========================= */

function updateCamera(){

 const desired=
  new THREE.Vector3(
   player.position.x,
   player.position.y+7,
   player.position.z+8
  );

 camera.position.lerp(
  desired,
  .1
 );

 camera.lookAt(
  player.position.x,
  .8,
  player.position.z
 );
}


/* =========================
   UI
========================= */

function updateUI(){

 document.getElementById(
  "hpText"
 ).textContent=
  Math.ceil(hp);

 document.getElementById(
  "hpBar"
 ).style.width=
  (hp/maxHp*100)+"%";

 document.getElementById(
  "levelText"
 ).textContent=
  level;

 document.getElementById(
  "xpBar"
 ).style.width=
  (xp/xpNeeded*100)+"%";

 document.getElementById(
  "waveText"
 ).textContent=
  wave;

 document.getElementById(
  "enemyText"
 ).textContent=
  enemies.length;
}


/* =========================
   Game Over
========================= */

function endGame(){

 running=false;

 document.getElementById(
  "finalLevel"
 ).textContent=level;

 document.getElementById(
  "finalWave"
 ).textContent=wave;

 document.getElementById(
  "gameOver"
 ).style.display="flex";
}


/* =========================
   Touch Joystick
========================= */

const joystick=
 document.getElementById(
  "joystick"
 );

const stick=
 document.getElementById(
  "stick"
 );

let joyActive=false;

joystick.addEventListener(
 "pointerdown",
 e=>{

  joyActive=true;

  joystick.setPointerCapture(
   e.pointerId
  );
 }
);

joystick.addEventListener(
 "pointermove",
 e=>{

  if(!joyActive)return;

  const r=
   joystick.getBoundingClientRect();

  let x=
   e.clientX-
   (r.left+r.width/2);

  let y=
   e.clientY-
   (r.top+r.height/2);

  const max=45;

  const d=Math.hypot(x,y);

  if(d>max){

   x=x/d*max;
   y=y/d*max;
  }

  stick.style.transform=
   `translate(${x}px,${y}px)`;

  joyX=x/max;
  joyY=y/max;
 }
);

function resetJoy(){

 joyActive=false;

 joyX=0;
 joyY=0;

 stick.style.transform=
  "translate(0,0)";
}

joystick.addEventListener(
 "pointerup",
 resetJoy
);

joystick.addEventListener(
 "pointercancel",
 resetJoy
);


/* =========================
   زر إطلاق
========================= */

const shootButton=
 document.getElementById(
  "shoot"
 );

shootButton.addEventListener(
 "pointerdown",
 ()=>{
  shooting=true;
 }
);

shootButton.addEventListener(
 "pointerup",
 ()=>{
  shooting=false;
 }
);

shootButton.addEventListener(
 "pointercancel",
 ()=>{
  shooting=false;
 }
);


/* =========================
   بدء اللعبة
========================= */

startWave();


/* =========================
   Game Loop
========================= */

let last=performance.now();

function animate(now){

 requestAnimationFrame(animate);

 const dt=
  Math.min(
   (now-last)/1000,
   .05
  );

 last=now;

 if(running){

  updatePlayer();

  updateEnemies();

  updateBullets();

  updateCamera();

  if(shooting)
   shoot();

  if(cooldown>0)
   cooldown-=dt;

  checkWave();

  updateUI();
 }

 renderer.render(
  scene,
  camera
 );
}

requestAnimationFrame(animate);


/* =========================
   Resize
========================= */

addEventListener(
 "resize",
 ()=>{
  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>

</body>
</html>
